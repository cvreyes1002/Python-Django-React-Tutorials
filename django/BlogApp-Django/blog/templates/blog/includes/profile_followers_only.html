<div class="list-group">
    {% block list %}{% endblock list %}
{% for follower in followers %}
  <a href="/profile/{{ follower.follower.id }}/" class="list-group-item list-group-item-action">
    <img class="avatar-tiny" src="{{ follower.follower.profile.avatar.url }}" />
    <strong>{{ follower.follower.first_name }} {{ follower.follower.last_name }}</strong>
  </a>
{% endfor %}
</div>
